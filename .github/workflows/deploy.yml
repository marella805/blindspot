name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME }} \
            --image ${{ vars.STUDENT }}:${{ github.sha }} \
            .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ca-${{ vars.STUDENT }} \
            --resource-group rg-students-platform \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.STUDENT }}:${{ github.sha }} \
            --set-env-vars "AUTH_SECRET=${{ secrets.AUTH_SECRET }}" "AUTH_RESEND_KEY=${{ secrets.AUTH_RESEND_KEY }}"
