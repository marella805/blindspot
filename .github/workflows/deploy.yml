name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ vars.ACR_NAME }} \
            --image ${{ vars.STUDENT }}:${{ github.sha }} \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL=/login \
            --build-arg NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/log \
            --build-arg NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/profile \
            .

      - name: Recover DATABASE_URL from running revision
        id: recover_db
        run: |
          # Pull DATABASE_URL from the most recently active (healthy) revision
          DB_URL=$(az containerapp revision list \
            --name ca-${{ vars.STUDENT }} \
            --resource-group rg-students-platform \
            --query "sort_by([?properties.healthState=='Healthy'], &properties.createdTime)[-1].properties.template.containers[0].env[?name=='DATABASE_URL'].value | [0]" \
            -o tsv 2>/dev/null || true)

          if [ -z "$DB_URL" ]; then
            echo "WARNING: Could not recover DATABASE_URL from a healthy revision"
          else
            echo "Recovered DATABASE_URL from healthy revision"
            echo "DB_URL=$DB_URL" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ca-${{ vars.STUDENT }} \
            --resource-group rg-students-platform \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.STUDENT }}:${{ github.sha }} \
            --set-env-vars \
              ${DB_URL:+"DATABASE_URL=$DB_URL"} \
              "CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}" \
              "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" \
              "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
              "CRON_SECRET=${{ secrets.CRON_SECRET }}"
        env:
          DB_URL: ${{ steps.recover_db.outputs.DB_URL }}
