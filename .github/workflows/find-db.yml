name: Find PostgreSQL resource (one-off)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find DB across all resource groups
        run: |
          echo "=== All PostgreSQL servers in subscription ==="
          az postgres flexible-server list \
            --query "[].{name:name, rg:resourceGroup, fqdn:fullyQualifiedDomainName, admin:administratorLogin}" \
            -o table 2>/dev/null || echo "None"

          echo ""
          echo "=== All resource groups ==="
          az group list --query "[].name" -o tsv

          echo ""
          echo "=== Container App full env (names + secretRef) ==="
          az containerapp show \
            --name ca-${{ vars.STUDENT }} \
            --resource-group rg-students-platform \
            --query "properties.template.containers[0].env" \
            -o json

          echo ""
          echo "=== Container App secrets (names only) ==="
          az containerapp secret list \
            --name ca-${{ vars.STUDENT }} \
            --resource-group rg-students-platform \
            --query "[].name" -o tsv
