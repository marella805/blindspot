services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blindspot
      POSTGRES_USER: blindspot
      POSTGRES_PASSWORD: blindspot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blindspot"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://blindspot:blindspot@db:5432/blindspot
    command: sh -c "npm ci --silent && npx drizzle-kit migrate"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://blindspot:blindspot@db:5432/blindspot
      AUTH_URL: http://localhost:3001
      AUTH_SECRET: docker-dev-secret-change-in-prod
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
